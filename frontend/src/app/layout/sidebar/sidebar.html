<div class="h-screen bg-cyan-900 backdrop-blur-sm w-64 p-6 flex flex-col">

  <!-- Logo -->
  <div class="logo flex items-center gap-3 text-white mt-5 mb-8">
    <span class="logo-icon bg-[rgba(255,255,255,0.2)] p-2 rounded-lg">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="26" height="26">
        <path d="M12 3L22 8.5V10H20V18H18V10.9L12 14L2 8.5L12 3Z" fill="currentColor"/>
        <path d="M6 11.5V17.5C6 18.9 8.69 20 12 20C15.31 20 18 18.9 18 17.5V11.5L12 14.94L6 11.5Z" fill="currentColor" opacity="0.55"/>
      </svg>
    </span>
    <h1 class="font-bold text-xl text-white">StudyAI</h1>
  </div>

  <!-- Nav Links — flex-1 pushes profile to bottom -->
  <nav class="flex flex-col gap-2 flex-1">
    <button routerLink="/dashboard" routerLinkActive="!bg-white/10 !text-white"
      class="flex items-center gap-3 text-white/70 hover:text-white hover:bg-white/10 cursor-pointer transition-all duration-200 font-medium px-4 py-2.5 rounded-lg w-full">
      <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15">
        <path d="M2 4.5A2.5 2.5 0 014.5 2h2A2.5 2.5 0 019 4.5v2A2.5 2.5 0 016.5 9h-2A2.5 2.5 0 012 6.5v-2zM11 4.5A2.5 2.5 0 0113.5 2h2A2.5 2.5 0 0118 4.5v2A2.5 2.5 0 0115.5 9h-2A2.5 2.5 0 0111 6.5v-2zM2 13.5A2.5 2.5 0 014.5 11h2A2.5 2.5 0 019 13.5v2A2.5 2.5 0 016.5 18h-2A2.5 2.5 0 012 15.5v-2zM11 13.5A2.5 2.5 0 0113.5 11h2A2.5 2.5 0 0118 13.5v2A2.5 2.5 0 0115.5 18h-2A2.5 2.5 0 0111 15.5v-2z"/>
      </svg>
      Dashboard
    </button>

    <button routerLink="/study-plan" routerLinkActive="!bg-white/10 !text-white"
      class="flex items-center gap-3 text-white/70 hover:text-white hover:bg-white/10 cursor-pointer transition-all duration-200 font-medium px-4 py-2.5 rounded-lg w-full">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Planner
    </button>

    <button routerLink="/ai-tutor" routerLinkActive="!bg-white/10 !text-white"
      class="flex items-center gap-3 text-white/70 hover:text-white hover:bg-white/10 cursor-pointer transition-all duration-200 font-medium px-4 py-2.5 rounded-lg w-full">
      <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
        <path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/>
        <path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"/>
      </svg>
      AI Tutor
    </button>

    <button routerLink="/progress" routerLinkActive="!bg-white/10 !text-white"
      class="flex items-center gap-3 text-white/70 hover:text-white hover:bg-white/10 cursor-pointer transition-all duration-200 font-medium px-4 py-2.5 rounded-lg w-full">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20v-4M9 20v-8M14 20V9M19 20V4M2 20h20"/>
      </svg>
      Progress
    </button>
  </nav>

  <!-- Profile Section — at bottom -->
<div class="border-t border-white/20 pt-4 relative">

  <!-- Profile Row -->
  <div
    (click)="toggleLogout()"
    class="flex items-center gap-3 text-white/70 hover:text-white hover:bg-white/10 cursor-pointer transition-all duration-200 font-medium px-4 py-2.5 rounded-lg w-full">
    <img
      src="https://avatars.dicebear.com/api/initials/john-doe.svg"
      alt="Profile Picture"
      class="w-9 h-9 rounded-full border border-white/20"/>
    <div class="flex flex-col leading-tight">
      <span class="text-white text-sm font-semibold">Sonu Kumar</span>
      <span class="text-white/40 text-xs">Free Plan</span>
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
      stroke="currentColor" width="16" height="16"
      class="ml-auto transition-transform duration-200"
      [class.rotate-90]="showLogout">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
  </div>

  <!-- Logout Popup — right side -->
  @if (showLogout) {
    <div class="absolute bottom-0 left-full ml-2 bg-cyan-800 border border-white/10 rounded-xl shadow-xl p-2 w-48 z-50">
      
      <!-- Logout Button -->
      <div
        (click)="logout()"
        class="flex items-center gap-3 text-red-400 hover:text-red-300 hover:bg-red-500/10 cursor-pointer transition-all duration-200 font-medium px-3 py-2 rounded-lg w-full">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </div>

    </div>
  }

</div>

</div>
